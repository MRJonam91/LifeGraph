<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:identifier>lg.graph.d4e8c1</dc:identifier>
        <dc:creator>Manoj Rollo (MRJonam91)</dc:creator>
        <dc:title>LifeGraph Visual Graph Architecture</dc:title>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Title Badge & Header -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="70" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">LIFEGRAPH v1.0</text>
    <text x="0" y="70" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc">Portable Personal Knowledge Graph</text>
    <text x="0" y="102" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">Cryptographic provenance · Fine-grained consent tags · Lossless multi-format export</text>
  </g>

  <!-- Left: Graph Visualization Card -->
  <g transform="translate(60, 180)" filter="url(#shadow)">
    <rect width="560" height="400" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Topological Entity Graph</text>
    <text x="24" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Directed property graph with referential integrity</text>

    <!-- Edge Lines -->
    <path d="M 140 160 L 260 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="200" y="150" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">OWNS</text>

    <path d="M 140 180 L 260 270" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="210" y="225" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle">PARTY_TO</text>

    <path d="M 370 160 L 440 210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="415" y="180" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">EXPIRES</text>

    <path d="M 370 280 L 440 230" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="415" y="270" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle">DEPENDS</text>

    <!-- Node 1: Person -->
    <g transform="translate(30, 130)">
      <rect width="110" height="60" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="55" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe" text-anchor="middle">PERSON</text>
      <text x="55" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Mario Rossi</text>
    </g>

    <!-- Node 2: Document -->
    <g transform="translate(260, 130)">
      <rect width="110" height="60" rx="8" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
      <text x="55" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dcfce7" text-anchor="middle">DOCUMENT</text>
      <text x="55" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Passport (YA12)</text>
    </g>

    <!-- Node 3: Contract -->
    <g transform="translate(260, 250)">
      <rect width="110" height="60" rx="8" fill="#7e22ce" stroke="#c084fc" stroke-width="1.5"/>
      <text x="55" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3e8ff" text-anchor="middle">CONTRACT</text>
      <text x="55" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Home Lease</text>
    </g>

    <!-- Node 4: Deadline -->
    <g transform="translate(440, 190)">
      <rect width="100" height="60" rx="8" fill="#c2410c" stroke="#fb923c" stroke-width="1.5"/>
      <text x="50" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffedd5" text-anchor="middle">DEADLINE</text>
      <text x="50" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Notice Window</text>
    </g>

    <!-- Provenance Footer -->
    <g transform="translate(24, 345)">
      <rect width="512" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" font-family="monospace" font-size="11" fill="#4ade80">✔ SHA-256 Digest: e3b0c44298fc1c14... (Cryptographically Verified)</text>
    </g>
  </g>

  <!-- Right: CLI Terminal Preview Card -->
  <g transform="translate(660, 180)" filter="url(#shadow)">
    <rect width="560" height="400" rx="16" fill="#0a0f1d" stroke="#334155" stroke-width="1.5"/>

    <!-- Terminal Window Bar -->
    <rect width="560" height="38" rx="16" fill="#1e293b"/>
    <circle cx="24" cy="19" r="6" fill="#f87171"/>
    <circle cx="44" cy="19" r="6" fill="#facc15"/>
    <circle cx="64" cy="19" r="6" fill="#4ade80"/>
    <text x="280" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">bash — npx lifegraph</text>

    <!-- Terminal Content -->
    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="12">
      <text x="0" y="20" fill="#94a3b8">$ <tspan fill="#38bdf8">npx lifegraph</tspan> inspect lifegraph.json</text>
      <text x="0" y="44" fill="#f8fafc" font-weight="700">=== LifeGraph Summary: Mario Rossi Personal Graph ===</text>
      <text x="0" y="66" fill="#94a3b8">Total Nodes: 7 (1 person, 2 documents, 2 contracts, 2 deadlines)</text>
      <text x="0" y="86" fill="#94a3b8">Total Edges: 7 (OWNS: 2, PARTY_TO: 2, EXPIRES_ON: 1, DEPENDS_ON: 1)</text>
      <text x="0" y="106" fill="#4ade80">✔ Provenance: 100% entities carry verified SHA-256 digests</text>

      <text x="0" y="146" fill="#94a3b8">$ <tspan fill="#38bdf8">npx lifegraph</tspan> deadlines lifegraph.json --days 90</text>
      <text x="0" y="170" fill="#facc15">[DUE_SOON]  38d | 2027-07-04 | Termine Disdetta Locazione</text>
      <text x="20" y="190" fill="#64748b">↳ Action: Inviare raccomandata A/R entro 6 mesi dalla scadenza</text>
      <text x="0" y="214" fill="#38bdf8">[UPCOMING]  54d | 2027-07-20 | Rinnovo Passaporto Italiano</text>

      <text x="0" y="254" fill="#94a3b8">$ <tspan fill="#38bdf8">npx lifegraph</tspan> export lifegraph.json --format jsonld --out schema.jsonld</text>
      <text x="0" y="278" fill="#4ade80">✔ Exported W3C Schema.org &amp; PROV-O Linked Data (7 entities)</text>
      <text x="0" y="308" fill="#c084fc">Tip: Independent open-source. Support via Ko-fi / GitHub Sponsors</text>
    </g>
  </g>
</svg>
